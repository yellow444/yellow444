name: generate arcade contribution graphs

# Based on the usage example from https://github.com/abozanona/pacman-contribution-graph (README, "Integrate into Your GitHub Profile").
# Only the games line differs: the README example builds "pacman,breakout", here it is pacman only.
# Output: pacman-contribution-graph.svg (light) and pacman-contribution-graph-dark.svg (dark) on the `output` branch.

on:
    schedule: # Run automatically every 24 hours
        - cron: '0 0 * * *'
    workflow_dispatch: # Allows manual triggering
    push: # Runs on every push to the main branch
        branches:
            - main

jobs:
    generate:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: generate contribution graph SVGs
              uses: abozanona/pacman-contribution-graph@main
              with:
                  github_user_name: ${{ github.repository_owner }}
                  # Comma-separated list of game names to generate. Default: pacman
                  games: 'pacman'
                  # Optional: omit the month labels row above the grid. Default: false
                  hide_month_labels: 'false'

            # Push the generated SVGs to the output branch
            # If this step ever fails because of the old Node runtime, v5.0.0 (node24) takes the same inputs.
            - name: push SVGs to the output branch
              uses: crazy-max/ghaction-github-pages@v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
